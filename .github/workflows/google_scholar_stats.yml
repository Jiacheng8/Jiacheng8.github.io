name: Update Google Scholar Citations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches:
      - main
    paths:
      - .github/workflows/google_scholar_stats.yml
      - google_scholar_crawler/**

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: SI_9kD0AAAAJ
        run: |
          python -m pip install -r requirements.txt
          python main.py

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update citation data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
