{% if site.visitor_stats.enabled %}
  <div class="visitor-stats" aria-label="Visitor statistics">
    {% if site.visitor_stats.title %}<h3>{{ site.visitor_stats.title }}</h3>{% endif %}
    <a href="{{ site.visitor_stats.stats_url }}" target="_blank" rel="noopener noreferrer">
      <img src="{{ site.visitor_stats.image_url }}" alt="Visitor count and country distribution" loading="lazy">
    </a>
  </div>
{% endif %}
